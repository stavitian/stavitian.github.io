<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Página principal de stavitian en GitHub Pages">
  <title>stavitian.github.io</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background:
        radial-gradient(circle at top left, #1d4ed8 0, transparent 36rem),
        #0f172a;
      color: #e2e8f0;
    }

    main {
      width: min(42rem, 100%);
      padding: clamp(2rem, 6vw, 4rem);
      text-align: center;
      border: 1px solid rgb(148 163 184 / 25%);
      border-radius: 1.25rem;
      background: rgb(15 23 42 / 78%);
      box-shadow: 0 2rem 5rem rgb(0 0 0 / 35%);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 8vw, 4rem);
      line-height: 1;
      color: #86efac;
    }

    p {
      margin: 0;
      color: #cbd5e1;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    nav {
      margin-top: 2rem;
      display: flex;
      gap: clamp(1rem, 4vw, 2.25rem);
      justify-content: center;
      flex-wrap: wrap;
    }

    nav a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: .82rem;
      letter-spacing: .24em;
      text-transform: uppercase;
      padding: .45rem .15rem;
      border-bottom: 1px solid transparent;
      transition: color .25s ease, border-color .25s ease;
    }

    nav a:hover,
    nav a:focus-visible {
      color: #86efac;
      border-color: #86efac;
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>¡Hola! 👋</h1>
    <p><strong>stavitian.github.io</strong> está funcionando correctamente.</p>
    <nav aria-label="Proyectos WebGL">
      <a href="/nocturne/">NOCTURNE</a>
      <a href="/nocturne/sanctum.html">SANCTVM</a>
      <a href="/nocturne/singvlaris.html">SINGVLARIS</a>
    </nav>
  </main>
</body>
</html>
